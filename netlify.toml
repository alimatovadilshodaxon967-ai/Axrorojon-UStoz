[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/ai/mentor"
  to = "/api/ai/mentor"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://axrorojon-ustoz.onrender.com/api/:splat"
  status = 200
  force = false
