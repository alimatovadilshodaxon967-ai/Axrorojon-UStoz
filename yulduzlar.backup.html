<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yulduzlar — bo'lajak pedagoglar uchun raqamli platforma</title>
<style>
:root{--bg:#F4F6FB;--sf:#fff;--ink:#16213E;--mu:#5B6783;--ln:#DDE2EE;--night:#16213E;--gold:#F2B33D;--teal:#1F7F82;--ok:#1E8A55;--bad:#C0392B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--sf:#172038;--ink:#EDF0F8;--mu:#9AA6C3;--ln:#26314F;--night:#0A0F1D;--teal:#4FC3C6;--ok:#4CC38A;--bad:#FF8A7A}}
:root[data-theme="dark"]{--bg:#0E1424;--sf:#172038;--ink:#EDF0F8;--mu:#9AA6C3;--ln:#26314F;--night:#0A0F1D;--teal:#4FC3C6;--ok:#4CC38A;--bad:#FF8A7A}
*,*:before,*:after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.logo{font-family:"Times New Roman",Times,serif;line-height:1.2;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--night);color:#fff;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:10px 14px}
.ib{background:none;border:1px solid #ffffff40;color:#fff;border-radius:10px;min-width:44px;height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.ib:hover{background:#ffffff18}
.logo{display:flex;align-items:center;gap:8px;font-size:1.5rem;font-weight:700;letter-spacing:.02em}
.logo svg{width:28px;height:28px}
.pf{position:relative;justify-self:end}
.menu{position:absolute;right:0;top:52px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:12px;min-width:190px;padding:6px;display:none;box-shadow:0 10px 30px #0004}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--bg)}
nav{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(330px,86vw);background:var(--night);color:#fff;transform:translateX(-102%);transition:transform .25s;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;overflow:auto}
nav.open{transform:none}
nav h2{font-size:1.2rem;padding:4px 10px 12px}
nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:#fff;padding:11px 10px;border-radius:10px;cursor:pointer;font-size:.98rem}
nav button:hover,nav button.on{background:#ffffff1c}
nav .st{margin-left:auto;color:var(--gold)}
nav hr{border:0;border-top:1px solid #ffffff30;margin:10px 0}
.sc{position:fixed;inset:0;background:#0007;z-index:25;display:none}.sc.open{display:block}
main{max-width:980px;margin:0 auto;padding:22px 16px 60px}
.hero{background:var(--night);color:#fff;border-radius:18px;padding:26px 22px 14px;overflow:hidden}
.hero h1{font-size:clamp(1.6rem,4.5vw,2.4rem)}
.hero p{color:#c6cee4;max-width:60ch;margin:8px 0 0}
.sky{width:100%;height:auto;display:block;margin-top:6px}
.sky .s{cursor:pointer}
.sky .s text{fill:#dfe5f5;font-size:13px;text-anchor:middle}
.sky .s polygon{fill:#4b5880;transition:fill .2s}
.sky .s.d polygon{fill:var(--gold)}
.sky .s:hover polygon,.sky .s:focus polygon{fill:#fff}
.sky line{stroke:#ffffff35;stroke-width:1.2}
.bar{height:8px;background:#ffffff25;border-radius:8px;margin:4px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}
.card h3{font-size:1.1rem;margin-bottom:6px}
.card p{margin:0;color:var(--mu);font-size:.95rem}
.tile{cursor:pointer;text-align:left;width:100%}
.tile:hover{border-color:var(--teal)}
.back{background:none;border:0;color:var(--teal);cursor:pointer;padding:6px 0;margin-bottom:6px}
.sec h2{font-size:clamp(1.5rem,4vw,2rem)}
.sec>p{color:var(--mu);max-width:65ch}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--ln)}
.btn.gold{background:var(--gold);color:#16213E}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--bg))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{border:1px solid var(--ln);padding:9px 10px;text-align:left;vertical-align:top}
th{background:var(--night);color:#fff;font-family:"Times New Roman",serif}
.stars button{background:none;border:0;font-size:1.9rem;cursor:pointer;color:var(--ln);padding:0 2px}
.stars button.on{color:var(--gold)}
.tag{display:inline-block;font-size:.8rem;background:color-mix(in srgb,var(--teal) 18%,var(--bg));color:var(--teal);border-radius:20px;padding:2px 10px;margin-bottom:8px}
.note{font-size:.9rem;color:var(--mu);margin-top:14px}
.ok{color:var(--ok)}body.lo #mb,body.lo #pb{display:none}
.cb{display:inline-flex;align-items:center;justify-content:center;min-width:56px;min-height:56px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);font-size:1.5rem;padding:4px;box-sizing:border-box}.cb.q{border:2px dashed var(--gold);color:var(--gold);font-weight:700}.opt.sv{display:inline-flex;width:auto;min-width:76px;justify-content:center;align-items:center;margin-right:8px}.opt svg,.opt .cb{pointer-events:none}.qimg{max-width:100%;max-height:320px;border-radius:10px;display:block;margin:10px 0}
.dh{display:grid;gap:14px}
.dh-hero{position:relative;overflow:hidden;border-radius:20px;padding:22px;color:#fff;background:radial-gradient(900px 300px at 85% -10%,#1f7f8266,transparent 60%),linear-gradient(135deg,#0d1a3a,#16213E 55%,#12304d)}
.dh-hero h1{font-size:clamp(1.5rem,4.5vw,2.2rem);position:relative}
.dh-hero>p{color:#c6cee4;margin:6px 0 0;position:relative}
.tw{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.55;animation:tw 4s ease-in-out infinite}
.tws{animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.12}}
.dh-top{display:grid;gap:12px;margin-top:16px;position:relative}
.dh-row{display:grid;gap:14px}
@media (min-width:820px){.dh-top{grid-template-columns:3fr 2fr}.dh-row.two{grid-template-columns:1fr 1fr}}
.glass{background:#ffffff14;border:1px solid #ffffff2e;border-radius:16px;padding:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.glass .lab{color:var(--gold);font-weight:700;letter-spacing:.06em;font-size:.8rem}
.glass h2{font-size:1.25rem;margin:6px 0 10px;font-weight:600;color:#fff}
.glass p{margin:0;color:#dfe5f5}
.glass .meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:#dfe5f5;font-size:.92rem}
.dh-go{margin-top:14px;background:var(--gold);color:#16213E;border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;transition:transform .2s}
.dh-go:hover{transform:translateY(-2px)}
.dh-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.dh-card{transition:transform .2s,border-color .2s}
.dh-card:hover{transform:translateY(-3px);border-color:var(--teal)}
.dh-i{color:var(--mu);font-size:.9rem}
.dh-v{font-family:"Times New Roman",Times,serif;font-size:1.7rem;font-weight:700;line-height:1.2;margin-top:2px}
.dh-card small{color:var(--mu)}
.dh-bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin:8px 0 4px}
.dh-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffd978);transition:width .9s ease}
.dh h2.t{font-size:1.2rem;margin-bottom:10px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl li:last-child{padding-bottom:0}
.tl li:before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--ln)}
.tl li:last-child:before{display:none}
.tl .dn:before{background:var(--gold)}
.tl .n{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--bg);border:2px solid var(--ln);color:var(--mu);z-index:1}
.tl .dn .n{background:var(--gold);border-color:var(--gold);color:#16213E}
.tl .cu .n{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 25%,transparent)}
.tl b{display:block}
.tl small{color:var(--mu)}
.gal{background:linear-gradient(160deg,#0d1a3a,#16213E);border-radius:14px;padding:10px}
.gal svg{width:100%;height:auto;display:block}
.gal .gl{stroke:#ffffff30;stroke-width:1.2}
.gal text{fill:#c6cee4;font-size:11px;text-anchor:middle}
.gs{cursor:pointer;outline:none}
.gs polygon{fill:#4b5880;opacity:.55}
.gs.d polygon{fill:var(--gold);opacity:1}
.gs.c polygon{fill:#fff;opacity:1}
.gs:focus-visible polygon{stroke:#fff;stroke-width:2}
.halo{fill:#ffffff;opacity:.35;transform-box:fill-box;transform-origin:center;animation:pl 2.2s ease-in-out infinite}
.gs.d .halo{fill:var(--gold);opacity:.22;animation:none}
@keyframes pl{50%{transform:scale(1.6);opacity:.1}}
#gt{position:fixed;z-index:60;max-width:240px;background:#0A0F1D;color:#fff;border:1px solid #ffffff40;border-radius:10px;padding:8px 10px;font-size:.85rem;display:none;pointer-events:none}
.bds{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.bd{text-align:center;padding:14px 8px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);opacity:.5;filter:grayscale(1)}
.bd.on{opacity:1;filter:none;border-color:var(--gold);animation:pop .5s ease both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.bd span{display:block;font-size:2rem}
.bd small{display:block;color:var(--mu);font-size:.78rem}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wk i{display:block;width:26px;height:26px;border-radius:50%;margin:6px auto 0;background:var(--ln)}
.wk .on i{background:var(--gold)}
.wk .td i{box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 55%,transparent)}
.wk .fu{opacity:.45}
.adv{background:linear-gradient(135deg,color-mix(in srgb,var(--teal) 14%,var(--sf)),var(--sf))}
.adv q{display:block;font-family:"Times New Roman",Times,serif;font-size:1.15rem;line-height:1.45;quotes:none}
.cl-hero{position:relative;overflow:hidden;border-radius:20px;padding:22px;color:#fff;background:radial-gradient(700px 260px at 90% -20%,#1f7f8266,transparent 60%),linear-gradient(135deg,#0d1a3a,#16213E 60%,#12304d)}
.cl-hero h2{font-size:clamp(1.5rem,4.5vw,2.1rem);position:relative;color:#fff}
.cl-hero p{color:#c6cee4;margin:6px 0 0;position:relative;max-width:60ch}
.cl-me{margin-top:12px}
.cl-st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}
.cl-st>div{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.cl-st i{display:block;font-style:normal;color:var(--mu);font-size:.82rem}
.cl-st b{font-family:"Times New Roman",Times,serif;font-size:1.3rem}
.cl-tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;margin-top:4px;-webkit-overflow-scrolling:touch}
.cl-tabs button{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;transition:transform .2s,box-shadow .2s}
.cl-tabs button:hover{transform:translateY(-2px);box-shadow:0 4px 14px color-mix(in srgb,var(--teal) 35%,transparent)}
.cl-tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.cl-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}
.cl-o{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;margin-top:8px;cursor:pointer;transition:transform .15s,border-color .15s}
.cl-o:hover:not(:disabled){border-color:var(--teal);transform:translateY(-1px)}
.cl-o:before{content:"";flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--mu)}
.cl-o.sel{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,var(--bg))}
.cl-o.sel:before{border-color:var(--teal);background:radial-gradient(var(--teal) 45%,transparent 50%)}
.cl-o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--bg))}
.cl-o.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.cl-o.sv{display:inline-flex;width:auto;margin-right:8px;justify-content:center}
.cl-o.sv:before{display:none}
.cl-o svg,.cl-o .cb{pointer-events:none}
.cl-o:disabled{cursor:default;color:var(--ink)}
.cl-exp{background:color-mix(in srgb,var(--gold) 14%,var(--sf));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--ln));border-radius:12px;padding:12px;margin-top:12px}
.cl-exp p{color:var(--ink);margin:4px 0 0}
.cl-v{font-weight:700;font-size:1.05rem;margin-top:12px;color:var(--ink)}
.cl-v.ok{color:var(--ok)}
.cl-win{position:relative;overflow:hidden;text-align:center;border-radius:16px;padding:18px;margin-top:14px;color:#fff;background:linear-gradient(135deg,#0d1a3a,#16213E 60%,#12304d);animation:winpop .5s ease both}
.cl-win h3{color:#fff;font-size:1.3rem}
.cl-win p{color:#dfe5f5}
.cl-win .row{justify-content:center}
.cl-gain{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0;font-weight:700;font-size:1.1rem}
.cl-gain span{background:#ffffff1c;border:1px solid #ffffff33;border-radius:999px;padding:6px 14px;color:var(--gold)}
.cl-big{font-family:"Times New Roman",Times,serif;font-size:2.6rem;font-weight:700;line-height:1.1}
@keyframes winpop{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}
.fly{position:absolute;bottom:0;font-size:1.4rem;opacity:0;animation:fly 1.8s ease-out .2s both;pointer-events:none}
.f1{left:20%}.f2{left:50%;animation-delay:.45s}.f3{left:78%;animation-delay:.7s}
@keyframes fly{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-130px);opacity:0}}
.cl-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:#16213E;color:#fff;border:2px solid var(--gold);border-radius:14px;padding:12px 18px;font-weight:600;box-shadow:0 0 24px #f2b33d66;animation:tin .4s ease both;max-width:90vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
#olist{list-style:none;margin:10px 0 0;padding:0}
#olist li{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-top:8px}
#olist li.drag{border-color:var(--gold);box-shadow:0 6px 20px #0003;background:var(--sf)}
#olist .nm{flex:1}
.cl-hd{cursor:grab;touch-action:none;font-size:1.3rem;padding:2px 8px;color:var(--mu);user-select:none}
.cl-mv{display:flex;gap:4px}
.cl-mv button{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;width:34px;height:34px;cursor:pointer}
.cl-mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cl-m{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:.95rem}
.cl-m.act{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent)}
.cl-m.used{opacity:.6}
.cl-m.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--bg))}
.cl-m.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.cl-chip{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:.8rem;margin-left:6px}
.cl-sc{width:100%;max-width:460px;height:auto;display:block;margin:10px 0;border-radius:12px}
.ds-hero{position:relative;overflow:hidden;border-radius:20px;padding:22px;color:#fff;background:radial-gradient(600px 240px at 100% -10%,#f2b33d33,transparent 60%),radial-gradient(500px 220px at 0% 120%,#1f7f8255,transparent 60%),linear-gradient(135deg,#0b1736,#16213E 60%,#10304a)}
.ds-hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:34px 34px;pointer-events:none}
.ds-hero h2{position:relative;color:#fff;font-size:clamp(1.5rem,4.5vw,2.1rem)}
.ds-hero p{position:relative;color:#c6cee4;margin:6px 0 0;max-width:62ch}
.ds-flow{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-size:.8rem}
.ds-flow span{background:#ffffff18;border:1px solid #ffffff2b;border-radius:999px;padding:3px 10px;color:#e9eefc}
.ds-st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.ds-st>div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px #0000000d}
.ds-st i{display:block;font-style:normal;color:var(--mu);font-size:.82rem}
.ds-st b{font-family:"Times New Roman",Times,serif;font-size:1.3rem}
.ds-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
@media (max-width:980px){.ds-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.ds-grid{grid-template-columns:1fr}}
.ds-card{display:flex;flex-direction:column;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(6px);border:1px solid var(--ln);border-radius:18px;padding:16px;box-shadow:0 6px 22px #0000001a;transition:transform .2s,box-shadow .2s,border-color .2s}
.ds-card:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 10px 28px color-mix(in srgb,var(--teal) 30%,transparent)}
.ds-card .ic{font-size:1.9rem}
.ds-card h3{margin:6px 0 2px}
.ds-card p{margin:0 0 8px;color:var(--mu);flex:1}
.ds-meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.ds-meta span{font-size:.82rem;border:1px solid var(--ln);background:var(--bg);border-radius:999px;padding:3px 10px}
.ds-chip{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--mu) 18%,var(--sf));color:var(--ink);align-self:flex-start;margin-bottom:4px}
.ds-chip.on{background:color-mix(in srgb,var(--teal) 22%,var(--sf));color:var(--teal)}
.ds-chip.fin{background:color-mix(in srgb,var(--gold) 28%,var(--sf))}
.ds-steps{display:flex;align-items:center;gap:0;margin:14px 0 4px}
.ds-s{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mu);cursor:pointer;font-size:.74rem;font-weight:700;padding:2px 4px;min-width:64px}
.ds-s b{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:2px solid var(--ln);background:var(--sf);font-size:1.15rem;transition:transform .2s,box-shadow .2s}

й и правый — различия, посередине — общие черты; заполняется в парах, затем обсуждается.","Masalan: O'zbek — ona tili; Ingliz — B1":"Например: узбекский — родной язык; английский — B1","O‘zgarishlar avtomatik saqlanadi va talabalarning «Rasmiy kundalik» tanlovlarida darhol ko‘rinadi. Fakultet bog‘langan kafedra/yo‘nalishlar faqat shu fakultet tanlanganda chiqadi; «har qanday» belgilanganlar hammada chiqadi. Dekan va mudir F.I.Sh. talaba tanlaganda hujjatga avtomatik qo‘yiladi.":"Изменения сохраняются автоматически и сразу отображаются в выборе «Официального дневника» у студентов. Кафедры/направления, связанные с факультетом, отображаются только при выборе этого факультета; отмеченные как «любые» отображаются у всех. Ф.И.О. декана и заведующего подставляются в документ автоматически при выборе студента.","Raqamli vositalar laboratoriyasi kartalari. Yangi platforma chiqsa, qo‘shing yoki mavjudini tahrirlang; «🆕 Yangi» belgisi talabalarga karta ustida ko‘rinadi. Qadamlarni har qatorga bittadan yozing (1–6 ta).":"Карточки лаборатории цифровых инструментов. Если появилась новая платформа, добавьте её или отредактируйте существующую; отметка «🆕 Новое» отображается студентам на карточке. Шаги записывайте по одному в строке (от 1 до 6).","Real vaziyat tavsiflanadi; guruhlar muammoni aniqlaydi, variantlarni taklif qiladi, eng yaxshi yechimni asoslaydi.":"Описывается реальная ситуация; группы определяют проблему, предлагают варианты и обосновывают наилучшее решение.","Savol beriladi; guruhlar 3 daqiqada tanqidsiz g'oya yozadi; so'ng eng samarali 2–3 g'oya tanlanadi va asoslanadi.":"Задаётся вопрос; группы за 3 минуты записывают идеи без критики; затем выбираются и обосновываются 2–3 наиболее эффективные идеи.","Savollaringiz Claude (Anthropic) ga yuboriladi. Javoblar yo'naltiruvchi xarakterda; muhim qarorlarni ustoz yoki metodist bilan tekshiring.":"Ваши вопросы отправляются в Claude (Anthropic). Ответы носят ориентировочный характер; важные решения проверяйте с наставником или методистом.","Strelka yuqoridan o'ngga, so'ng pastga buriladi; keyingi qadamda chapga qaraydi.":"Стрелка поворачивает сверху вправо, затем вниз; на следующем шаге смотрит влево.","Talaba amaliyot davrida 6 soatlik ish kuni davomiyligida amaliyot o‘tkazilayotgan korxona, tashkilot, muassasada bo‘lishi;":"В период практики студент должен находиться на предприятии, в организации, учреждении, где проходит практика, в течение 6-часового рабочего дня;","Talaba amaliyot davridagi faoliyatni va kuzatishlarni qayd etish uchun kundalik yuritishi;":"Студент в период практики должен вести дневник для фиксации своей деятельности и наблюдений;","Titul, eslatma, yo‘llanma, I–IV bo‘limlar va baholash varag‘i. Imzo va muhrni chop etgandan keyin qo‘lda qo‘yasiz; III–IV bo‘limlarni korxona va kafedra rahbarlari to‘ldiradi.":"Титульный лист, памятка, направление, разделы I–IV и оценочный лист. Подпись и печать ставятся вручную после распечатки; разделы III–IV заполняют руководители предприятия и кафедры.","To‘liqroq matn (har kun uchun ~1400 belgigacha; standart — qisqa, ~600 belgigacha)":"Более подробный текст (до ~1400 символов на каждый день; по умолчанию — краткий, до ~600 символов)","Uchlik (oy, yulduz, yulduz) takrorlanadi; oydan keyin yulduz keladi.":"Тройка (луна, звезда, звезда) повторяется; после луны идёт звезда.","Xaritani bosing yoki 📍 markerni sudrab joyni belgilang; radius o'zgarganda doira yangilanadi.":"Нажмите на карту или перетащите маркер 📍, чтобы отметить место; при изменении радиуса круг обновляется.","«Onlayn dars» va «an'anaviy dars»: umumiy — maqsad va baholash; farq — muhit va vositalar.":"«Онлайн-урок» и «традиционный урок»: общее — цель и оценивание; различия — среда и средства.","«⚙️ Sozlamalar»dan olinadi. Ro‘yxatda yo‘q bo‘lsa, «Boshqa» ni tanlab o‘zingiz yozing; ro‘yxatni administrator tahrirlaydi.":"Берётся из «⚙️ Настроек». Если в списке нет, выберите «Другое» и впишите самостоятельно; список редактирует администратор.","🔒 Joylashuvingiz faqat amali
